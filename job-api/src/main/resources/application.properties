server.port=8080

# Graceful shutdown: Spring waits up to 30s for in-flight requests to complete
# before the process exits after receiving SIGTERM.
# Change to "immediate" for the Week 1 break exercise.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Expose all actuator endpoints — useful for observing health state during shutdown
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
